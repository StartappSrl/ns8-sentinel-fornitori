# Elenco dei percorsi da includere nel backup gestito nativamente dal core
# NS8 (comando "module-backup", basato su Restic - vedi
# https://nethserver.github.io/ns8-core/modules/backup_restore/).
#
# Non serve più uno script di backup custom (il vecchio docker/backup.sh):
# il core include automaticamente lo stato e i volumi elencati qui a ogni
# backup programmato del modulo. Il volume di ClamAV (solo definizioni
# virus, rigenerabile) è escluso di proposito per non appesantire i backup.

state/environment
volumes/sentinel-postgres-data
volumes/sentinel-minio-data
